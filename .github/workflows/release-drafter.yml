name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    name: Update the draft release
    runs-on: ubuntu-latest
    steps:
      - name: Draft the next release
        id: drafter
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The Build workflow is chained off this one via workflow_run, and a
      # workflow_run payload carries no job outputs. Hand the draft's identity
      # over as an artifact instead, so the build can stamp the right version
      # and attach the APK to the right release without needing to hunt for
      # the draft with an elevated token.
      - name: Record the draft for the Build workflow
        env:
          RELEASE_ID: ${{ steps.drafter.outputs.id }}
          RESOLVED_VERSION: ${{ steps.drafter.outputs.resolved_version }}
          TAG_NAME: ${{ steps.drafter.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_ID:-}" ] || [ -z "${RESOLVED_VERSION:-}" ]; then
            echo "::error::release-drafter did not report a release id or version"
            exit 1
          fi
          mkdir -p draft
          printf '%s\n' "$RELEASE_ID" > draft/release-id
          printf '%s\n' "$RESOLVED_VERSION" > draft/version
          printf '%s\n' "$TAG_NAME" > draft/tag
          cat draft/release-id draft/version draft/tag

      - name: Upload the draft descriptor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-release
          path: draft/
          retention-days: 7
