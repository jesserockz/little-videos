name: Build

on:
  pull_request:
  workflow_dispatch:
  # Chained off the drafter rather than run in parallel with it: both would
  # otherwise race to mutate the same draft release body.
  workflow_run:
    workflows:
      - Release Drafter
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    # A workflow_run fires for every conclusion, including cancelled and failure.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure the Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          # No-ops when the runner image already ships these, which it normally does.
          # 'yes' dies of SIGPIPE once sdkmanager stops reading, hence the '|| true'.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"

      - name: Fetch the draft descriptor
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: draft-release
          path: draft
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          if [ -f draft/version ]; then
            VERSION_NAME="$(cat draft/version)"
          else
            # PR and manual builds are not releases, so the build.sh defaults stand.
            VERSION_NAME=""
          fi
          VERSION_CODE=""
          if [ -n "$VERSION_NAME" ]; then
            if ! printf '%s' "$VERSION_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::drafted version '$VERSION_NAME' is not major.minor.patch"
              exit 1
            fi
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
            VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME:-<build.sh default>} version_code=${VERSION_CODE:-<build.sh default>}"

      - name: Decode the signing keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            if [ "${{ github.event_name }}" = "workflow_run" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set, so this release build cannot be signed with the release key."
              exit 1
            fi
            echo "::warning::No signing key available (expected for a fork PR). Building with a disposable key; this APK is not installable as an update and must not be released."
            echo "allow_generated_key=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          ( umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.p12" )
          if [ ! -s "$RUNNER_TEMP/signing/release.p12" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore"
            exit 1
          fi
          echo "keystore=$RUNNER_TEMP/signing/release.p12" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          ANDROID_KEYSTORE: ${{ steps.keystore.outputs.keystore }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ALLOW_GENERATED_KEY: ${{ steps.keystore.outputs.allow_generated_key }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./build.sh

      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-videos-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  attach:
    name: Attach the APK to the draft release
    needs: build
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Fetch the draft descriptor
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: draft-release
          path: draft
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Fetch the APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: little-videos-apk
          path: apk

      - name: Upload the APK to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_ID="$(cat draft/release-id)"
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::the draft descriptor carries no release id"
            exit 1
          fi
          APK="$(find apk -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::no APK in the build artifact"
            exit 1
          fi
          NAME="$(basename "$APK")"

          # Re-runs would otherwise collide with the asset the first run uploaded.
          if ! EXISTING="$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --paginate --jq ".[] | select(.name == \"$NAME\") | .id")"; then
            echo "::error::could not list the assets on release $RELEASE_ID"
            exit 1
          fi
          if [ -n "$EXISTING" ]; then
            while read -r ASSET_ID; do
              [ -n "$ASSET_ID" ] || continue
              echo "replacing existing asset $ASSET_ID ($NAME)"
              gh api --method DELETE "repos/$REPO/releases/$RELEASE_ID/assets/$ASSET_ID"
            done <<< "$EXISTING"
          fi

          echo "uploading $NAME to release $RELEASE_ID"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$NAME" > /dev/null

      - name: Clear the pending-assets caution
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_ID="$(cat draft/release-id)"
          if ! BODY="$(gh api "repos/$REPO/releases/$RELEASE_ID" --jq '.body')"; then
            echo "::error::could not read the body of release $RELEASE_ID"
            exit 1
          fi
          if ! CLEANED="$(BODY="$BODY" python3 -c 'import os, re, sys; sys.stdout.write(re.sub(r"<!-- ASSETS_PENDING -->.*?<!-- /ASSETS_PENDING -->\s*", "", os.environ["BODY"], flags=re.S).lstrip())')"; then
            echo "::error::failed to strip the ASSETS_PENDING caution"
            exit 1
          fi
          if [ "$CLEANED" = "$BODY" ]; then
            echo "no ASSETS_PENDING caution present, leaving the body alone"
            exit 0
          fi
          gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" -f body="$CLEANED" --jq '.id' > /dev/null
          echo "caution removed; release $RELEASE_ID is ready to publish"
