---
name: Build

on:
  pull_request:
  workflow_dispatch:
  # Chained off the drafter rather than run in parallel with it: both would
  # otherwise race to mutate the same draft release body.
  workflow_run:
    workflows:
      - Release Drafter
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    # A workflow_run fires for every conclusion, including cancelled and failure.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      # Downloaded outside the workspace: actions/checkout wipes untracked
      # files, which would delete the descriptor before it can be read.
      - name: Fetch the draft descriptor
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: draft-release
          path: ${{ runner.temp }}/draft
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The drafter commits the F-Droid changelog to main AFTER the push that
      # triggered it, so workflow_run.head_sha is the commit before that one.
      # Building it would produce a release tagged at a commit whose changelog
      # file does not exist. The descriptor carries the real SHA.
      - name: Resolve the commit and version
        id: target
        env:
          DRAFT: ${{ runner.temp }}/draft
        run: |
          set -euo pipefail
          REF=""
          VERSION_NAME=""
          VERSION_CODE=""
          if [ -f "$DRAFT/sha" ]; then
            REF="$(cat "$DRAFT/sha")"
            VERSION_NAME="$(cat "$DRAFT/version")"
            VERSION_CODE="$(cat "$DRAFT/version-code")"
            if ! printf '%s' "$REF" | grep -qE '^[0-9a-f]{40}$'; then
              echo "::error::the draft descriptor holds '$REF', not a commit SHA"
              exit 1
            fi
            if ! printf '%s' "$VERSION_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::the draft descriptor holds version '$VERSION_NAME'"
              exit 1
            fi
            echo "building $REF as $VERSION_NAME ($VERSION_CODE)"
          else
            # PR and manual builds are not releases; build.sh defaults apply.
            echo "no draft descriptor, building the triggering commit at the build.sh default version"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Empty means the ref that triggered the workflow.
          ref: ${{ steps.target.outputs.ref }}

      # Release builds (workflow_run) require the real key; PR/manual builds may use a
      # disposable one. Empty version inputs mean build.sh defaults.
      - name: Build and verify reproducibility
        id: build
        uses: ./.github/actions/android-build
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          require-key: ${{ github.event_name == 'workflow_run' }}
          version-name: ${{ steps.target.outputs.name }}
          version-code: ${{ steps.target.outputs.code }}

      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: little-videos-apk
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

  attach:
    name: Attach the APK to the draft release
    needs: build
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Fetch the draft descriptor
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: draft-release
          path: draft
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Fetch the APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: little-videos-apk
          path: apk

      - name: Upload the APK to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_ID="$(cat draft/release-id)"
          TAG="$(cat draft/tag)"
          if [ -z "$RELEASE_ID" ] || [ -z "$TAG" ]; then
            echo "::error::the draft descriptor is missing an id or a tag"
            exit 1
          fi
          case "$TAG" in
            untagged-*)
              echo "::error::the draft's tag is the placeholder '$TAG'."
              echo "::error::Some earlier PATCH dropped tag_name. Fix the draft's tag by hand."
              exit 1
              ;;
          esac

          APK="$(find apk -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::no APK in the build artifact"
            exit 1
          fi
          NAME="$(basename "$APK")"

          # Only the same-name case: a re-run of this workflow uploads the
          # same file again, and the API rejects a duplicate name. Clearing
          # APKs from a superseded version is the drafter's job, since it is
          # the thing that decides what version the draft represents.
          # gh's --jq takes a single expression and does not accept jq's own
          # --arg, so the name is bound by piping into real jq instead.
          if ! ASSETS_JSON="$(gh api "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100")"; then
            echo "::error::could not list the assets on release $RELEASE_ID"
            exit 1
          fi
          EXISTING="$(printf '%s' "$ASSETS_JSON" | jq -r --arg n "$NAME" '.[] | select(.name == $n) | .id')"
          if [ -n "$EXISTING" ]; then
            while read -r ASSET_ID; do
              [ -n "$ASSET_ID" ] || continue
              echo "replacing existing $NAME"
              gh api --method DELETE \
                "repos/$REPO/releases/assets/$ASSET_ID" < /dev/null
            done <<< "$EXISTING"
          fi

          echo "uploading $NAME to release $RELEASE_ID"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$NAME" \
            > /dev/null

      # One PATCH carries every change to the draft. It pins target_commitish to
      # the commit the APK was built from, so publishing later cuts the tag there
      # rather than at whatever main's tip has become, and it drops the
      # ASSETS_PENDING caution now that the APK is attached.
      #
      # tag_name and name ride along on every PATCH by necessity: updating a
      # draft release without re-sending them makes GitHub reset its tag to an
      # untagged-<sha> placeholder, which would then be published as the tag.
      - name: Update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_ID="$(cat draft/release-id)"
          TAG="$(cat draft/tag)"
          # The same SHA the build job checked out: the drafter's changelog
          # commit, not the push that triggered it.
          BUILT_SHA="$(cat draft/sha)"

          if ! printf '%s' "$BUILT_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::the draft descriptor holds '$BUILT_SHA', not a commit SHA"
            exit 1
          fi
          if ! RELEASE="$(gh api "repos/$REPO/releases/$RELEASE_ID")"; then
            echo "::error::could not read release $RELEASE_ID"
            exit 1
          fi

          TITLE="$(printf '%s' "$RELEASE" | jq -r '.name // ""')"
          [ -n "$TITLE" ] || TITLE="$TAG"

          BODY="$(printf '%s' "$RELEASE" | jq -r '.body // ""')"
          CLEANED="$(printf '%s\n' "$BODY" \
            | sed '/<!-- ASSETS_PENDING -->/,/<!-- \/ASSETS_PENDING -->/d' \
            | sed '/./,$!d')"

          gh api "repos/$REPO/releases/$RELEASE_ID" \
            --method PATCH \
            --raw-field "tag_name=$TAG" \
            --raw-field "name=$TITLE" \
            --raw-field "target_commitish=$BUILT_SHA" \
            --raw-field "body=$CLEANED" \
            --field "draft=true" \
            --silent

          # The tag reset is intermittent, so confirm rather than assume.
          if ! AFTER="$(gh api "repos/$REPO/releases/$RELEASE_ID" --jq '.tag_name')"; then
            echo "::error::could not re-read release $RELEASE_ID"
            exit 1
          fi
          if [ "$AFTER" != "$TAG" ]; then
            echo "::error::the draft's tag changed from '$TAG' to '$AFTER' during the update"
            exit 1
          fi
          echo "draft $RELEASE_ID: tag $TAG, tagging $BUILT_SHA, caution cleared"
