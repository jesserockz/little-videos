---
name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # yamllint ships with the ubuntu-24.04 runner image, so there is nothing
      # to install. Print the version so an image bump shows up in the log.
      - name: Run yamllint
        run: |
          set -euo pipefail
          yamllint --version
          yamllint --strict --format github -c .yamllint.yml .

  metadata:
    name: Store metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Tags let the per-entry JDK check compare against each tagged build.sh.
          fetch-depth: 0

      # The F-Droid recipe and build.sh can drift apart silently, and a
      # description over the length limit is invisible until submission.
      - name: Check the store metadata
        run: ./tools/check-metadata.sh

  tools:
    name: Tool tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # fdroid-changelog.sh runs unattended in the drafter and its output is
      # committed and published, so its edge cases need pinning down.
      - name: Run the tool tests
        run: ./tools/test-tools.sh
