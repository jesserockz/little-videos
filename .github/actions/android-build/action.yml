---
name: Android build
description: Builds and verifies the signed APK, shared by Build and Release.

# Input definitions cannot use expression syntax, even in descriptions.
inputs:
  keystore-base64:
    description: Base64 of the PKCS12 release keystore. Empty means no key.
    required: false
    default: ""
  keystore-password:
    description: Password of the keystore. Empty means build.sh's default.
    required: false
    default: ""
  key-alias:
    description: Alias of the signing key. Empty means build.sh's default.
    required: false
    default: ""
  require-key:
    description: '"true" fails without a keystore; "false" falls back to a disposable key (fork PRs only).'
    required: false
    default: "true"
  version-name:
    description: versionName to stamp. Empty means the build.sh default.
    required: false
    default: ""
  version-code:
    description: versionCode to stamp. Empty means the build.sh default.
    required: false
    default: ""
  debug:
    description: '"true" also builds the side-by-side debug APK.'
    required: false
    default: "false"
  working-directory:
    description: Existing checkout to build in.
    required: false
    default: "."

outputs:
  apk:
    description: Absolute path of the signed APK.
    value: ${{ steps.result.outputs.apk }}
  apk-sha256:
    description: sha256 of the signed APK.
    value: ${{ steps.result.outputs.apk_sha256 }}
  unsigned-sha256:
    description: sha256 of the unsigned APK, which is what must reproduce.
    value: ${{ steps.result.outputs.unsigned_sha256 }}
  debug-apk:
    description: Absolute path of the debug APK, empty unless debug is "true".
    value: ${{ steps.debug.outputs.apk }}

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
      with:
        distribution: temurin
        java-version: "17"

    - name: Ensure the Android SDK components
      shell: bash
      run: |
        set -euo pipefail
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          echo "::error::sdkmanager not found at $SDKMANAGER"
          exit 1
        fi
        # Usually a no-op. 'yes' dies of SIGPIPE, hence '|| true'.
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

    - name: Decode the signing keystore
      id: keystore
      shell: bash
      env:
        ANDROID_KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        REQUIRE_KEY: ${{ inputs.require-key }}
      run: |
        set -euo pipefail
        if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
          if [ "$REQUIRE_KEY" = "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set, so this release build cannot be signed with the release key."
            exit 1
          fi
          echo "::warning::No signing key available, expected for a fork PR."
          echo "::warning::Building with a disposable key: this APK cannot install"
          echo "::warning::as an update over a real release and must not be published."
          echo "allow_generated_key=1" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        mkdir -p "$RUNNER_TEMP/signing"
        ( umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.p12" )
        if [ ! -s "$RUNNER_TEMP/signing/release.p12" ]; then
          echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore"
          exit 1
        fi
        echo "keystore=$RUNNER_TEMP/signing/release.p12" >> "$GITHUB_OUTPUT"

    # Empty VERSION_* are treated as unset by build.sh (${VAR:-default}).
    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ANDROID_KEYSTORE: ${{ steps.keystore.outputs.keystore }}
        ANDROID_KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        ANDROID_KEY_ALIAS: ${{ inputs.key-alias }}
        ALLOW_GENERATED_KEY: ${{ steps.keystore.outputs.allow_generated_key }}
        VERSION_NAME: ${{ inputs.version-name }}
        VERSION_CODE: ${{ inputs.version-code }}
      run: ./build.sh

    # F-Droid compares a rebuild byte for byte, so catch non-determinism here.
    # Needs the Build step's env because it rebuilds. On pass, dist/ is the release.
    - name: Verify reproducibility
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ANDROID_KEYSTORE: ${{ steps.keystore.outputs.keystore }}
        ANDROID_KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        ANDROID_KEY_ALIAS: ${{ inputs.key-alias }}
        ALLOW_GENERATED_KEY: ${{ steps.keystore.outputs.allow_generated_key }}
        VERSION_NAME: ${{ inputs.version-name }}
        VERSION_CODE: ${{ inputs.version-code }}
      run: ./tools/verify-reproducible.sh

    - name: Record the APK and its hashes
      id: result
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        APKS=()
        for F in dist/*.apk; do
          [ -f "$F" ] && APKS+=("$F")
        done
        if [ "${#APKS[@]}" -ne 1 ]; then
          echo "::error::expected exactly one APK in dist/, found ${#APKS[@]}"
          exit 1
        fi
        APK="$(realpath "${APKS[0]}")"
        APK_SUM="$(sha256sum "$APK" | cut -d' ' -f1)"
        SUM="$(sha256sum build/unsigned.apk | cut -d' ' -f1)"
        echo "APK: $APK"
        echo "APK sha256: $APK_SUM"
        echo "unsigned APK sha256: $SUM"
        {
          echo "apk=$APK"
          echo "apk_sha256=$APK_SUM"
          echo "unsigned_sha256=$SUM"
        } >> "$GITHUB_OUTPUT"
        {
          echo "### Reproducible build"
          echo
          echo "Unsigned APK \`sha256\`: \`$SUM\`"
          echo
          echo "Any rebuild of this commit with the same toolchain must match."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Build the debug APK
      id: debug
      if: inputs.debug == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ANDROID_KEYSTORE: ${{ steps.keystore.outputs.keystore }}
        ANDROID_KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        ANDROID_KEY_ALIAS: ${{ inputs.key-alias }}
        ALLOW_GENERATED_KEY: ${{ steps.keystore.outputs.allow_generated_key }}
        VERSION_NAME: ${{ inputs.version-name }}
        VERSION_CODE: ${{ inputs.version-code }}
        BUILD_VARIANT: debug
      run: |
        set -euo pipefail
        ./build.sh
        APKS=()
        for F in dist/debug/*.apk; do
          [ -f "$F" ] && APKS+=("$F")
        done
        if [ "${#APKS[@]}" -ne 1 ]; then
          echo "::error::expected exactly one APK in dist/debug/, found ${#APKS[@]}"
          exit 1
        fi
        APK="$(realpath "${APKS[0]}")"
        echo "debug APK: $APK"
        echo "apk=$APK" >> "$GITHUB_OUTPUT"
