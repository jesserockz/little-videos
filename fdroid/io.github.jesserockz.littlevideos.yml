# F-Droid metadata for Little Videos.
#
# This file does NOT belong to this repo at build time. It is the file to submit
# as a merge request against
#   https://gitlab.com/fdroid/fdroiddata
# at
#   metadata/io.github.jesserockz.littlevideos.yml
# A copy is kept here so it stays in step with build.sh.
#
# The flow this configures is "reproducible builds with the developer's
# signature": F-Droid rebuilds the tagged source, compares it byte for byte
# against the APK attached to the GitHub release, and on a match publishes the
# APK signed with jesserockz's key rather than re-signing with F-Droid's.
# That is what Binaries plus AllowedAPKSigningKeys means below.
---
Categories:
  - Multimedia
License: Apache-2.0
AuthorName: Jesse Hills
SourceCode: https://github.com/jesserockz/little-videos
IssueTracker: https://github.com/jesserockz/little-videos/issues
Changelog: https://github.com/jesserockz/little-videos/releases

AutoName: Little Videos

# No Description or Summary here on purpose. Text in this file OVERRIDES the
# per-locale metadata in the app's own repo, and the F-Droid docs ask that these
# fields be removed once that metadata exists. The description now lives in
# fastlane/metadata/android/en-US/ in the app repo, where it can be edited
# without a merge request against fdroiddata.

RepoType: git
Repo: https://github.com/jesserockz/little-videos.git

# Publish the developer-signed APK from the GitHub release, not an F-Droid
# rebuild, once the rebuild is confirmed identical.
Binaries: https://github.com/jesserockz/little-videos/releases/download/v%v/little-videos-%v.apk

# SHA-256 of the signing certificate, lowercase hex, no colons. Get it with:
#   apksigner verify --print-certs dist/little-videos-<v>.apk \
#     | awk '/Signer #1 certificate SHA-256/ {print $NF}'
AllowedAPKSigningKeys: ce8a11d289bdf6f53d54428ed486f0d4a0574fd82ba271a5028e48dd6d5fc467

Builds:
  - versionName: 1.0.0
    versionCode: 10000
    commit: v1.0.0
    output: dist/little-videos-1.0.0.apk
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless zip unzip binutils
    build:
      # build.sh pins everything that decides the output hash: TZ=UTC, LC_ALL=C,
      # SOURCE_DATE_EPOCH from the commit date, and JDK 17. It refuses to run on
      # a different JDK major version rather than emit a differing APK.
      #
      # VERSION_CODE is derived from the tag as major*10000 + minor*100 + patch,
      # which is what the GitHub release workflow does.
      - export ANDROID_HOME=$$SDK$$
      - export VERSION_NAME=1.0.0
      - export VERSION_CODE=10000
      - ./build.sh

MaintainerNotes: |-
  No Gradle. The build runs aapt2, javac, d8, zipalign and apksigner straight
  from the SDK, driven by build.sh, and needs build-tools 35.0.0, platform 35
  and JDK 17. build.sh fails rather than falling back to another JDK, because
  javac 17 and javac 21 emit different bytecode and the APK would not verify.

  build.sh also asserts that the built APK declares zero permissions and fails
  the build if any appear. That assertion is the point of the app.

  Reproducibility is checked on every CI run by tools/verify-reproducible.sh,
  which rebuilds under a different wall clock, timezone and locale and
  compares against the first build.

# Both off deliberately. F-Droid's checkupdates finds new versions by parsing
# AndroidManifest.xml or build.gradle in tagged revisions for the highest
# versionCode, and this app has a version in neither: build.sh stamps it via
# aapt2 --version-code from the release tag, so there is nothing for the scanner
# to read. Adding a versionCode to the manifest purely to feed it would create a
# second source of truth that aapt2 silently overrides, which is worse than
# adding one Builds entry per release by hand.
AutoUpdateMode: None
UpdateCheckMode: Static
CurrentVersion: 1.0.0
CurrentVersionCode: 10000
